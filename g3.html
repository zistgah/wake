<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fast Single-Language Voice Paddle Ball</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #121212; color: #f0f0f0; }
    .panel { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    .setting-row { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    select, input[type="text"] { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; width: 60%; }
    button { padding: 10px 18px; font-size: 1rem; margin-right: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #555; color: #999; cursor: not-allowed; }
    
    #displayArea { background: #1a1a1a; border: 2px solid #444; border-radius: 8px; height: 220px; position: relative; overflow: hidden; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; }
    canvas { background: #000; border-radius: 4px; }

    #log { background: #000; border: 1px solid #333; padding: 10px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 0.9em; border-radius: 4px; }
    .ack { color: #000; font-weight: bold; background: #00ff66; padding: 2px 6px; display: inline-block; border-radius: 3px; }
    .sys { color: #888; font-size: 0.8em; }
  </style>
</head>
<body>

  <h2>Fast Voice Paddle Ball Game</h2>

  <div class="panel">
    <div class="setting-row">
      <label>Language:</label>
      <select id="langSelect">
        <option value="en-US">English</option>
        <option value="hi-IN">Hindi</option>
      </select>
    </div>
    <div class="setting-row">
      <label><input type="checkbox" id="useWakeWord"> Use Wake Word</label>
    </div>
    <div class="setting-row">
      <label>Wake Phrase:</label>
      <input type="text" id="wakeWordInput" value="computer">
    </div>
  </div>

  <div id="displayArea">
    <canvas id="pongCanvas" width="400" height="200"></canvas>
  </div>

  <div style="margin-bottom: 15px;">
    <button id="startBtn">Start Game</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="log">System Ready... Say "left", "right", "left left", etc.</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logEl = document.getElementById('log');
    const langSelect = document.getElementById('langSelect');
    const useWakeWordCb = document.getElementById('useWakeWord');
    const wakeWordInput = document.getElementById('wakeWordInput');
    const pongCanvas = document.getElementById('pongCanvas');
    const ctx = pongCanvas.getContext('2d');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) alert("Speech Recognition not supported.");

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true; // Use interim results for rapid response

    let isRunning = false;
    let rollingBuffer = "";
    
    // Game variables
    let paddleX = 160;
    let ballX = 200, ballY = 100, ballDx = 2.5, ballDy = -2.5;
    let gameInterval = null;

    function logMessage(msg, type = 'sys') {
      const entry = document.createElement('div');
      entry.className = type;
      entry.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    function normalizeText(text) {
      return text.toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9\u0900-\u097F\s]/g, " ").replace(/\s+/g, " ").trim();
    }

    function parseAndMove(text) {
      const leftMatches = (text.match(/left|बाएं/g) || []).length;
      const rightMatches = (text.match(/right|दाएं/g) || []).length;

      if (leftMatches > 0) {
        paddleX -= (leftMatches * 20);
        if (paddleX < 0) paddleX = 0;
      }
      if (rightMatches > 0) {
        paddleX += (rightMatches * 20);
        if (paddleX > 320) paddleX = 320;
      }
    }

    recognition.onresult = (event) => {
      let transcript = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        transcript += event.results[i][0].transcript;
      }
      
      const cleanTranscript = transcript.trim();
      if (!cleanTranscript) return;

      logMessage(`[Heard]: "${cleanTranscript}"`, 'ack');

      if (!useWakeWordCb.checked) {
        parseAndMove(cleanTranscript);
      } else {
        rollingBuffer += " " + cleanTranscript;
        const cleanBuffer = normalizeText(rollingBuffer);
        const target = normalizeText(wakeWordInput.value);

        if (cleanBuffer.includes(target) && target.length > 0) {
          const parts = cleanBuffer.split(target);
          const command = parts[parts.length - 1].trim();
          if (command) {
            parseAndMove(command);
          }
        }
        if (rollingBuffer.length > 200) rollingBuffer = rollingBuffer.slice(-200);
      }
    };

    recognition.onend = () => {
      if (isRunning) {
        try { recognition.start(); } catch(e) {}
      }
    };

    recognition.onerror = () => {};

    function startGameLoop() {
      if (gameInterval) return;
      gameInterval = setInterval(() => {
        ctx.clearRect(0, 0, pongCanvas.width, pongCanvas.height);
        
        // Draw Paddle
        ctx.fillStyle = "#00ff66";
        ctx.fillRect(paddleX, 185, 80, 10);

        // Move Ball
        ballX += ballDx;
        ballY += ballDy;
        if (ballX < 5 || ballX > 395) ballDx = -ballDx;
        if (ballY < 5) ballDy = -ballDy;

        // Paddle Collision
        if (ballY >= 175 && ballX >= paddleX && ballX <= paddleX + 80) {
          ballDy = -ballDy;
        }

        // Draw Ball
        ctx.beginPath();
        ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
        ctx.fillStyle = "#ffaa00";
        ctx.fill();
        ctx.closePath();
      }, 1000 / 30);
    }

    function stopGameLoop() {
      clearInterval(gameInterval);
      gameInterval = null;
    }

    startBtn.onclick = () => {
      isRunning = true;
      rollingBuffer = "";
      recognition.lang = langSelect.value;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      startGameLoop();
      
      try { recognition.start(); } catch(e) {}
      logMessage("Game started! Speak 'left', 'right', or 'left left'.", "sys");
    };

    stopBtn.onclick = () => {
      isRunning = false;
      recognition.stop();
      stopGameLoop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      logMessage("Game stopped.", "sys");
    };
  </script>
</body>
</html>
