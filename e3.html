<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Web Translator</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; background: #121212; color: #f0f0f0; }
    .panel { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
    .setting-row { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    select { padding: 8px; border-radius: 4px; border: 1px solid #555; background: #111; color: #fff; width: 60%; }
    button { padding: 12px 20px; font-size: 1rem; margin-right: 8px; cursor: pointer; background: #00a86b; color: white; border: none; border-radius: 4px; font-weight: bold; }
    button:disabled { background: #444; color: #888; cursor: not-allowed; }
    #log { background: #000; border: 1px solid #333; padding: 12px; height: 350px; overflow-y: auto; font-family: monospace; border-radius: 4px; }
    .interim { color: #888; font-style: italic; }
    .original { color: #aaaaaa; }
    .translated { color: #00ff66; font-weight: bold; }
    .sys { color: #00bfff; font-size: 0.8em; }
  </style>
</head>
<body>

  <h2>Live Voice Translator</h2>

  <div class="panel">
    <div class="setting-row">
      <label>I am speaking:</label>
      <select id="sourceLang">
        <option value="en-US">English</option>
        <option value="hi-IN">Hindi</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
      </select>
    </div>
    
    <div class="setting-row">
      <label>Translate to:</label>
      <select id="targetLang">
        <option value="hi-IN">Hindi</option>
        <option value="en-US">English</option>
        <option value="es-ES">Spanish</option>
        <option value="fr-FR">French</option>
      </select>
    </div>
  </div>

  <div style="margin-bottom: 15px;">
    <button id="startBtn">Start Translating</button>
    <button id="stopBtn" disabled>Stop</button>
  </div>

  <div id="log">System Ready...</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const logEl = document.getElementById('log');
    const sourceLang = document.getElementById('sourceLang');
    const targetLang = document.getElementById('targetLang');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const synth = window.speechSynthesis;

    if (!SpeechRecognition || !synth) {
      alert("Web Speech API not supported.");
    }

    const recognition = new SpeechRecognition();
    recognition.continuous = true;
    recognition.interimResults = true;

    let isSystemActive = false;
    let isSpeaking = false;
    let interimDiv = null;
    
    // Keep utterance alive on Android
    window.utteranceKeeper = []; 

    function logMessage(msg, type = 'sys') {
      const entry = document.createElement('div');
      entry.className = type;
      entry.innerHTML = msg;
      logEl.appendChild(entry);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Google Translate API Hack (Free, unsupported endpoint)
    async function translateText(text, srcLocale, targetLocale) {
      try {
        // Extract just the language code (e.g., "en-US" -> "en")
        const src = srcLocale.split('-')[0];
        const tgt = targetLocale.split('-')[0];
        
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${src}&tl=${tgt}&dt=t&q=${encodeURIComponent(text)}`;
        const response = await fetch(url);
        const data = await response.json();
        
        return data[0][0][0]; // Extract translated string from Google's array structure
      } catch (e) {
        logMessage(`[Translation Error]: ${e.message}`, 'sys');
        return "Translation failed.";
      }
    }

    function speakOutLoud(text, locale) {
      if (text.trim() === "") return;
      
      isSpeaking = true;
      recognition.stop(); 

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = locale; // Must match target language so accent is correct
      
      window.utteranceKeeper.push(utterance);
      
      utterance.onend = () => {
        isSpeaking = false;
        window.utteranceKeeper = window.utteranceKeeper.filter(u => u !== utterance);
        if (isSystemActive) { try { recognition.start(); } catch(e) {} }
      };
      
      utterance.onerror = (e) => {
        isSpeaking = false;
        window.utteranceKeeper = window.utteranceKeeper.filter(u => u !== utterance);
        if (isSystemActive) { try { recognition.start(); } catch(e) {} }
      };

      synth.speak(utterance);
    }

    recognition.onstart = () => logMessage("[System] Listening...", "sys");

    recognition.onresult = async (event) => {
      if (isSpeaking) return;

      let interimTranscript = '';
      let finalTranscript = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          finalTranscript += event.results[i][0].transcript;
        } else {
          interimTranscript += event.results[i][0].transcript;
        }
      }

      if (interimTranscript) {
        if (!interimDiv) {
          interimDiv = document.createElement('div');
          interimDiv.className = 'interim';
          logEl.appendChild(interimDiv);
        }
        interimDiv.textContent = `[Hearing...] ${interimTranscript}`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      if (finalTranscript) {
        if (interimDiv) { interimDiv.remove(); interimDiv = null; }
        
        const textToTranslate = finalTranscript.trim();
        logMessage(`[Heard]: "${textToTranslate}"`, 'original');

        // Pause mic while fetching translation
        recognition.stop(); 
        logMessage("[System] Translating...", "sys");

        const translatedText = await translateText(textToTranslate, sourceLang.value, targetLang.value);
        logMessage(`[Translated]: "${translatedText}"`, 'translated');
        
        // Speak the translation
        speakOutLoud(translatedText, targetLang.value);
      }
    };

    recognition.onend = () => {
      if (interimDiv) { interimDiv.remove(); interimDiv = null; }
      if (isSystemActive && !isSpeaking) {
        try { recognition.start(); } catch (e) { }
      }
    };

    recognition.onerror = (event) => {
      if (event.error !== 'no-speech') {
        logMessage(`[Error]: ${event.error}`, 'sys');
      }
    };

    startBtn.onclick = () => {
      if (sourceLang.value === targetLang.value) {
        alert("Source and Target languages must be different!");
        return;
      }
      
      recognition.lang = sourceLang.value;
      isSystemActive = true;
      startBtn.disabled = true;
      stopBtn.disabled = false;
      logMessage(`[System] Starting Live Translator...`, "sys");
      
      try { recognition.start(); } catch(e) {}
    };

    stopBtn.onclick = () => {
      isSystemActive = false;
      recognition.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      logMessage(`[System] Stopped.`, "sys");
    };

  </script>
</body>
</html>
