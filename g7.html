<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RT Voice Paddle — Fast</title>

<style>
  body{
    margin:0;
    background:#111;
    color:#eee;
    font:15px system-ui,sans-serif;
    display:flex;
    justify-content:center;
    padding:24px;
  }
  .app{width:420px}
  h2{margin:0 0 16px}
  select,button{
    font:inherit;
    padding:9px 12px;
    border-radius:6px;
    border:1px solid #444;
    background:#1c1c1c;
    color:#fff;
  }
  button{background:#1677ff;border:0;font-weight:600;cursor:pointer}
  button:disabled{background:#444;color:#888}
  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
  .bar select{flex:1}
  canvas{
    display:block;
    width:100%;
    background:#000;
    border:1px solid #333;
    border-radius:8px;
  }
  #status{margin-top:10px;color:#aaa;font-size:13px}
  #heard{margin-top:6px;color:#00ff66;font-weight:600;height:20px}
</style>
</head>

<body>
<div class="app">

  <h2>RT Voice Paddle</h2>

  <div class="bar">
    <select id="lang">
      <option value="en-US">English</option>
      <option value="hi-IN">Hindi</option>
    </select>

    <button id="start">Start</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <canvas id="game" width="400" height="200"></canvas>

  <div id="status">Ready — say “left” or “right”.</div>
  <div id="heard"></div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const start = document.getElementById("start");
const stop = document.getElementById("stop");
const lang = document.getElementById("lang");

const status = document.getElementById("status");
const heard = document.getElementById("heard");

const SpeechRecognition =
  window.SpeechRecognition || window.webkitSpeechRecognition;

if (!SpeechRecognition) {
  status.textContent = "Speech recognition unavailable.";
  start.disabled = true;
}

const recognition = SpeechRecognition
  ? new SpeechRecognition()
  : null;

let running = false;

let paddleX = 160;

let ballX = 200;
let ballY = 100;
let ballDX = 2.5;
let ballDY = -2.5;

const commands = [];

function command(direction) {
  commands.push(direction);
}

if (recognition) {
  recognition.continuous = true;
  recognition.interimResults = false;

  recognition.onresult = e => {
    const text = e.results[e.results.length - 1][0]
      .transcript
      .toLowerCase()
      .trim();

    heard.textContent = `"${text}"`;

    const tokens = text.split(/\s+/);

    for (const token of tokens) {
      if (/^(left|बाएं)$/.test(token)) command(-1);
      if (/^(right|दाएं)$/.test(token)) command(1);
    }
  };

  recognition.onend = () => {
    if (running) {
      try {
        recognition.start();
      } catch {}
    }
  };
}

function update() {
  while (commands.length) {
    paddleX += commands.shift() * 15;
  }

  paddleX = Math.max(0, Math.min(320, paddleX));

  ballX += ballDX;
  ballY += ballDY;

  if (ballX <= 5 || ballX >= 395)
    ballDX *= -1;

  if (ballY <= 5)
    ballDY *= -1;

  if (
    ballY >= 174 &&
    ballX >= paddleX &&
    ballX <= paddleX + 80
  ) {
    ballDY *= -1;
  }

  if (ballY > 205) {
    ballX = 200;
    ballY = 100;
  }
}

function draw() {
  ctx.clearRect(0, 0, 400, 200);

  ctx.fillStyle = "#00ff66";
  ctx.fillRect(paddleX, 185, 80, 10);

  ctx.beginPath();
  ctx.arc(ballX, ballY, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#ffaa00";
  ctx.fill();
}

function loop() {
  if (!running) return;

  update();
  draw();

  requestAnimationFrame(loop);
}

start.onclick = () => {
  running = true;

  start.disabled = true;
  stop.disabled = false;

  recognition.lang = lang.value;

  try {
    recognition.start();
  } catch {}

  status.textContent = "Listening…";
  loop();
};

stop.onclick = () => {
  running = false;

  start.disabled = false;
  stop.disabled = true;

  try {
    recognition.stop();
  } catch {}

  status.textContent = "Stopped.";
};

draw();
</script>
</body>
</html>
