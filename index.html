<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wake-Word & Live Speech Listener</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; line-height: 1.5; }
    button { padding: 10px 16px; font-size: 1rem; margin-right: 8px; cursor: pointer; }
    #status { font-weight: bold; margin: 15px 0; color: #333; }
    #log { background: #f4f4f4; border: 1px solid #ccc; padding: 12px; height: 320px; overflow-y: auto; font-family: monospace; border-radius: 4px; }
    .heard { color: #555; }
    .interim { color: #888; font-style: italic; }
    .ack { color: #007a00; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Live Speech & Command Listener</h2>
  <button id="startBtn">Start Listening</button>
  <button id="stopBtn" disabled>Stop</button>

  <p id="status">Status: Idle</p>
  <div id="log"></div>

  <script>
    const WAKE_PHRASE = "computer it's for you";

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const statusEl = document.getElementById('status');
    const logEl = document.getElementById('log');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      alert("Web Speech API not supported in this browser. Please use Chrome, Edge, or Safari.");
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true; // Enables live/real-time printing before phrase completes
      recognition.lang = 'en-US';

      let isListening = false;
      let interimEl = null;

      function logMessage(msg) {
        const entry = document.createElement('div');
        entry.innerHTML = msg;
        logEl.appendChild(entry);
        logEl.scrollTop = logEl.scrollHeight;
      }

      function updateInterim(msg) {
        if (!interimEl) {
          interimEl = document.createElement('div');
          interimEl.className = 'interim';
          logEl.appendChild(interimEl);
        }
        interimEl.textContent = `[Hearing...]: ${msg}`;
        logEl.scrollTop = logEl.scrollHeight;
      }

      function clearInterim() {
        if (interimEl) {
          interimEl.remove();
          interimEl = null;
        }
      }

      recognition.onresult = (event) => {
        let currentInterim = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          const result = event.results[i];
          const rawTranscript = result.transcript.trim();

          if (result.isFinal) {
            clearInterim();

            // 1. Print everything heard
            logMessage(`<span class="heard">[Heard]:</span> "${rawTranscript}"`);

            // 2. Normalize and check for wake phrase
            const cleanTranscript = rawTranscript.toLowerCase().replace(/['’]/g, "'").replace(/[^a-z0-9'\s]/g, "");
            const matchIndex = cleanTranscript.indexOf(WAKE_PHRASE);

            if (matchIndex !== -1) {
              const command = cleanTranscript.substring(matchIndex + WAKE_PHRASE.length).trim();
              if (command.length > 0) {
                logMessage(`<span class="ack">[ACK]</span> Yes, received command: "${command}"`);
              } else {
                logMessage(`<span class="ack">[ACK]</span> Wake phrase recognized, but no command followed.`);
              }
            }
          } else {
            // Live stream transcript as user is actively speaking
            currentInterim += rawTranscript;
            updateInterim(currentInterim);
          }
        }
      };

      recognition.onend = () => {
        clearInterim();
        if (isListening) {
          try {
            recognition.start();
          } catch (e) {
            console.error(e);
          }
        } else {
          statusEl.textContent = "Status: Stopped";
        }
      };

      recognition.onerror = (event) => {
        logMessage(`[Error]: ${event.error}`);
      };

      startBtn.onclick = () => {
        isListening = true;
        recognition.start();
        statusEl.textContent = "Status: Listening...";
        startBtn.disabled = true;
        stopBtn.disabled = false;
      };

      stopBtn.onclick = () => {
        isListening = false;
        recognition.stop();
        startBtn.disabled = false;
        stopBtn.disabled = true;
      };
    }
  </script>
</body>
</html>
